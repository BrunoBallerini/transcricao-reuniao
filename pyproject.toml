[project]
name = "transcricao"
version = "0.1.0"
description = "Grava reuniões (microfone e áudio do sistema) e transcreve no PC com faster-whisper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core==1.13.8",
    "soundcard>=0.4.6",
    "soundfile>=0.14.0",
]

[project.scripts]
transcricao = "transcricao:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
